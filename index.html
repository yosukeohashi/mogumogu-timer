<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>もぐもぐタイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Klee+One:wght@400;600&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
/* レイアウト: 左に「食たく」のステージ（ミントのかべ＋赤いギンガムのテーブルクロス）、右にこんだてカードふうの操作パネル。
   絵はすべて太いふちどりのステッカー調。大たんなのはテーブルクロスだけ、ほかはしずかに。単一テーマ。 */
:root{
  color-scheme: light;
  --wall:#BFE6DC;
  --wall-light:#DBF3EC;
  --cloth:#E4472F;
  --cloth-light:#FFF6EC;
  --ink:#2A2238;
  --sun:#FFC93C;
  --card:#FFFDF8;
  --muted:#6D6478;
  --line:#E9E2D6;
  --font-display:"Mochiy Pop One","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --font-body:"Klee One","UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --font-num:"Baloo 2","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--card);color:var(--ink);
  font-family:var(--font-body);font-weight:600;font-size:18px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #2F6BFF;outline-offset:3px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr)}

/* ---------- ステージ ---------- */
.stage{position:relative;overflow:hidden;background:var(--wall);border-right:4px solid var(--ink);min-height:0}
.stage svg.scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:14px;height:20px;border-radius:4px;border:2px solid var(--ink);
  animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.scene,.thumb{--fur:#F5B94E;--fur-light:#FFE6AE;--ear-in:#E8855A}
.ol{stroke:var(--ink);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.fur{fill:var(--fur)} .furl{fill:var(--fur-light)} .earin{fill:var(--ear-in)}
.thumb .ol{stroke-width:12}

#foodLift{transition:opacity .3s}
.scene[data-state="done"] #foodLift{opacity:0}
#chara,#foodLift,#rBack{will-change:transform}

.spark{fill:#FFC93C;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;opacity:0;animation:spark .95s ease-out forwards}
@keyframes spark{0%{opacity:0;scale:.2;rotate:-40deg}30%{opacity:1;scale:1.15}100%{opacity:0;scale:.7;rotate:50deg}}
.mogu{font-family:var(--font-display);font-size:30px;fill:var(--ink);animation:mogu 1.9s ease-out forwards}
@keyframes mogu{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}

/* ---------- パネル ---------- */
.panel{container-type:inline-size;display:flex;flex-direction:column;gap:18px;
  padding:clamp(14px,2.4vw,28px);overflow-y:auto;min-height:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(24px,7cqi,38px);margin:0;line-height:1.2;letter-spacing:.02em}
h1 span{color:var(--cloth)}
.tools{display:flex;gap:8px}
.tool{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);font-size:15px}
.tool svg{width:20px;height:20px}
.tool[aria-pressed="false"] .on{display:none}
.tool[aria-pressed="true"] .off{display:none}

.view{display:none;flex-direction:column;gap:18px;flex:1;animation:viewIn .45s cubic-bezier(.2,.9,.3,1.15)}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}}
.v-run,.v-done{gap:22px}
body[data-phase="setup"] .v-setup,
body[data-phase="run"] .v-run,body[data-phase="pause"] .v-run,
body[data-phase="done"] .v-done{display:flex}

.group{display:flex;flex-direction:column;gap:10px}
.label{font-size:16px;color:var(--muted);display:flex;align-items:center;gap:10px}
.label::after{content:"";flex:1;border-top:2.5px dotted var(--line)}

.btn{border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:10px 18px;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;font-weight:600}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.main{background:var(--sun);font-family:var(--font-display);font-weight:400;font-size:clamp(22px,7cqi,32px);padding:12px 20px;letter-spacing:.06em}
.btn[aria-pressed="true"]{background:var(--sun)}
.v-setup .main{position:sticky;bottom:0;margin-top:auto}

.time-row{display:flex;align-items:center;justify-content:center;gap:16px}
.step{width:56px;height:56px;padding:0;border-radius:50%;font-family:var(--font-num);font-size:38px;line-height:1;display:grid;place-items:center}
.mins{font-family:var(--font-num);font-weight:800;font-size:clamp(64px,24cqi,112px);line-height:.85;
  font-variant-numeric:tabular-nums;min-width:1.5em;text-align:center}
.unit{font-size:26px;align-self:flex-end;padding-bottom:6px;margin-left:-8px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips .btn{padding:6px 14px;border-radius:999px;box-shadow:0 4px 0 var(--ink);font-size:17px}
.chips .btn b{font-family:var(--font-num);font-size:21px;font-weight:800}

/* えらぶカード */
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pick{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 8px 10px;line-height:1.3}
.pick .cap{font-size:14px;color:var(--muted)}
.pick .pic{width:min(124px,72%);display:block}
.pick .pic svg{width:100%;height:auto;display:block}
.pick .name{font-size:19px}
.pick .chg{font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--cloth-light);margin-top:2px}
.random{align-self:center;padding:6px 18px;border-radius:999px;box-shadow:0 4px 0 var(--ink);font-size:16px;border-style:dashed}

/* えらぶ一らん */
dialog{border:4px solid var(--ink);border-radius:24px;padding:0;background:var(--card);color:var(--ink);
  width:min(780px,94vw);max-height:90vh;font:inherit;overflow:auto}
dialog::backdrop{background:rgba(42,34,56,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg-head h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0}
.dlg-head .btn{padding:6px 16px;box-shadow:0 4px 0 var(--ink);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;padding-bottom:6px}
.grid .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;font-size:15px;line-height:1.3;box-shadow:0 4px 0 var(--ink)}
.grid svg{width:70px;height:auto;display:block}

/* タイマー中 */
.v-run,.v-done{justify-content:center;text-align:center}
.status{font-family:var(--font-display);font-size:clamp(20px,6cqi,30px);min-height:1.5em}
body[data-last="1"] .status{color:var(--cloth)}
.remain-label{font-size:20px;color:var(--muted)}
.clock{font-family:var(--font-num);font-weight:800;font-size:clamp(88px,34cqi,260px);line-height:.95;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bar{height:22px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--cloth-light)}
.bar i{display:block;height:100%;background:var(--cloth);transform-origin:left center;border-right:3px solid var(--ink)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.row .btn{flex:1 1 150px;font-size:22px;padding:14px 16px}
.done-msg{font-family:var(--font-display);font-size:clamp(30px,10cqi,64px);line-height:1.3;text-wrap:balance}
.done-msg b{display:inline-block;font-weight:400;animation:wave 1.5s ease-in-out infinite;animation-delay:calc(var(--i)*80ms)}
.done-msg .r{color:var(--cloth)}
@keyframes wave{0%,55%,100%{transform:translateY(0)}28%{transform:translateY(-14px)}}
.clock{transform-origin:center}

@media (max-width:860px){
  .app{grid-template-columns:1fr;height:auto;min-height:100%}
  .stage{height:54vh;min-height:300px;border-right:0;border-bottom:4px solid var(--ink)}
  .panel{overflow:visible}
}
@media (prefers-reduced-motion:reduce){
  .scene *,.confetti i,.done-msg b,.view{animation:none !important}
}
</style>

  R.pawR.setAttribute('cx',pRx.toFixed(2));R.pawR.setAttribute('cy',pRy.toFixed(2));R.pawR.setAttribute('rx',prx);R.pawR.setAttribute('ry',pry);
  /* うで：テーブルの下から手までのびる */
  var sxL=162+tilt.x*1.2,sxR=438+tilt.x*1.2,gLx=205+0.95*pLx,gLy=270+0.95*pLy,gRx=205+0.95*pRx,gRy=270+0.95*pRy;
  var dL='M'+sxL.toFixed(1)+' 526Q'+(sxL-22+(gLx-sxL)*0.25).toFixed(1)+' '+((526+gLy)/2+14).toFixed(1)+' '+gLx.toFixed(1)+' '+gLy.toFixed(1);
  var dR='M'+sxR.toFixed(1)+' 526Q'+(sxR+22+(gRx-sxR)*0.25).toFixed(1)+' '+((526+gRy)/2+14).toFixed(1)+' '+gRx.toFixed(1)+' '+gRy.toFixed(1);
  R.aLo.setAttribute('d',dL);R.aLi.setAttribute('d',dL);R.aRo.setAttribute('d',dR);R.aRi.setAttribute('d',dR);
  /* 食べ物のかげ：持ち上げるほど小さく、うすく */
  var hh=clamp(-lift.x/172,0,1),gone=done>=order.length&&phase!=='setup';
  R.shadow.setAttribute('cx',(205+0.95*(100+hx)).toFixed(1));R.shadow.setAttribute('rx',(78-30*hh).toFixed(1));
  R.shadow.setAttribute('opacity',gone?0:(0.2-0.12*hh).toFixed(3));

  /* かじりあと・かけら（テーブルに落ちてはねる） */
  var i,gi,p;
  for(i=growing.length-1;i>=0;i--){
    gi=growing[i];var uu=(T-gi.t0)/0.16,e=uu>=1?1:1-Math.pow(1-uu,3);
    for(var q2=0;q2<3;q2++)gi.els[q2].setAttribute('transform','translate('+gi.cx+' '+gi.cy+') scale('+e.toFixed(3)+')');
    if(uu>=1)growing.splice(i,1);
  }
  for(i=parts.length-1;i>=0;i--){
    p=parts[i];p.life-=dt;
    if(p.life<=0){p.el.remove();parts.splice(i,1);continue}
    if(!p.rest){
      p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.y>p.fl&&p.vy>0){p.y=p.fl;p.vx*=0.45;if(p.vy<90){p.rest=1}else{p.vy*=-0.35}}
      p.el.setAttribute('cx',p.x.toFixed(1));p.el.setAttribute('cy',p.y.toFixed(1));
    }
    p.el.setAttribute('opacity',Math.min(1,p.life/0.4).toFixed(2));
  }

  /* のこり時間のバーと、さい後の10びょう */
  if(phase==='run'){
    var ms=Math.max(0,endAt-Date.now());
    R.bar.style.transform='scaleX('+(ms/totalMs).toFixed(4)+')';
    R.clock.style.transform=(ms<=10000&&ms>0&&M)?'scale('+(1+0.07*Math.exp(-6*(1-(ms%1000)/1000))).toFixed(4)+')':'';
  }else if(phase==='setup'){R.bar.style.transform='scaleX(1)'}
}

/* ---------- 紙ふぶき ---------- */
function clearConfetti(){$('confetti').textContent=''}
function confetti(){
  if(reduce)return;
  var box=$('confetti'),cols=['#FFC93C','#E4472F','#FFFFFF','#59B85C','#7FD6C2'];
  for(var i=0;i<42;i++){
    var p=document.createElement('i');
    p.style.left=(Math.random()*100)+'%';
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(2.2+Math.random()*2.2)+'s';
    p.style.animationDelay=(Math.random()*.9)+'s';
    box.appendChild(p);
  }
  setTimeout(function(){if(phase==='done')clearConfetti()},6000);
}

/* ---------- じゅんび画面 ---------- */
function applyFood(){
  var f=food();
  Array.prototype.forEach.call(document.querySelectorAll('.fu'),function(u){u.setAttribute('href','#food-'+f.id)});
  $('fleshFlood').setAttribute('flood-color',FLESH[f.id]||'#FFFFFF');
  $('foodPic').innerHTML=foodThumb(f);$('foodName').textContent=f.name;
  F=f;
  buildBites(S.mins*60);
  lift.snap(lift.t);updateHold(true);drop.x=-80*M;drop.v=0;kickR.v+=30*M;
}
function applyChara(){
  var c=byId(CHARAS,S.chara);
  scene.style.setProperty('--fur',c.fur);scene.style.setProperty('--fur-light',c.light);scene.style.setProperty('--ear-in',c.ear);
  $('chara').innerHTML=charaMarkup(c,true);
  $('pawL').style.fill=c.paw||'';$('pawR').style.fill=c.paw||'';
  $('charaPic').innerHTML=charaThumb(c);$('charaName').textContent=c.name;
  bindRig();squash.v+=1.6*M;
  $('aLi').setAttribute('stroke',c.paw||c.fur);$('aRi').setAttribute('stroke',c.paw||c.fur);
}
function applyMins(){
  $('mins').textContent=S.mins;
  Array.prototype.forEach.call($('presets').children,function(b){b.setAttribute('aria-pressed',+b.dataset.m===S.mins)});
  $('clock').textContent=fmt(S.mins*60000);
  if(phase==='setup')buildBites(S.mins*60);
}
PRESETS.forEach(function(m){
  var b=document.createElement('button');b.type='button';b.className='btn';b.dataset.m=m;
  b.innerHTML='<b>'+m+'</b>分';
  b.addEventListener('click',function(){S.mins=m;applyMins();save()});
  $('presets').appendChild(b);
});

/* えらぶ一らん */
var dlg=$('picker');
function closePicker(){try{dlg.close()}catch(e){dlg.removeAttribute('open')}}
function openPicker(kind){
  var list=kind==='food'?FOODS:CHARAS,cur=kind==='food'?S.food:S.chara,g=$('pickGrid');
  $('pickTitle').textContent=kind==='food'?'食べ物を えらぶ':'キャラクターを えらぶ';
  g.textContent='';
  list.forEach(function(it){
    var b=document.createElement('button');b.type='button';b.className='btn';
    b.setAttribute('aria-pressed',it.id===cur);
    b.innerHTML=(kind==='food'?foodThumb(it):charaThumb(it))+'<span>'+it.name+'</span>';
    b.addEventListener('click',function(){
      if(kind==='food'){S.food=it.id;applyFood()}else{S.chara=it.id;applyChara()}
      save();closePicker();popSound();
    });
    g.appendChild(b);
  });
  try{dlg.showModal()}catch(e){dlg.setAttribute('open','')}
}
$('pickFood').addEventListener('click',function(){openPicker('food')});
$('pickChara').addEventListener('click',function(){openPicker('chara')});
$('pickClose').addEventListener('click',closePicker);
dlg.addEventListener('click',function(e){if(e.target===dlg)closePicker()});
$('randomBtn').addEventListener('click',function(){
  function other(list,cur){var it;do{it=list[Math.floor(Math.random()*list.length)]}while(it.id===cur);return it.id}
  S.chara=other(CHARAS,S.chara);S.food=other(FOODS,S.food);
  applyChara();applyFood();save();slideSound();
});

$('minus').addEventListener('click',function(){S.mins=Math.max(1,S.mins-1);applyMins();save()});
$('plus').addEventListener('click',function(){S.mins=Math.min(60,S.mins+1);applyMins();save()});
$('startBtn').addEventListener('click',start);
$('pauseBtn').addEventListener('click',pauseToggle);
$('resetBtn').addEventListener('click',toSetup);
$('backBtn').addEventListener('click',toSetup);
$('againBtn').addEventListener('click',start);

$('soundBtn').setAttribute('aria-pressed',S.sound);
$('soundBtn').addEventListener('click',function(){
  S.sound=!S.sound;this.setAttribute('aria-pressed',S.sound);save();
  if(S.sound)tone(660,880,.15,'sine',.18);
});
var fs=$('fsBtn');
if(!document.fullscreenEnabled){fs.hidden=true}
fs.addEventListener('click',function(){
  try{
    if(document.fullscreenElement){document.exitFullscreen()}
    else{var p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){})}
  }catch(e){}
});

(function(){var t='ごちそうさまでした!',h='';for(var i=0;i<t.length;i++)h+='<b style="--i:'+i+'"'+(i===4||i===5?' class="r"':'')+'>'+t.charAt(i)+'</b>';$('doneMsg').innerHTML=h})();
applyChara();applyFood();applyMins();
requestAnimationFrame(frame);
})();
