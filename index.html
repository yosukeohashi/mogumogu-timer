/* レイアウト: 左に「食たく」のステージ（ミントのかべ＋赤いギンガムのテーブルクロス）、右にこんだてカードふうの操作パネル。
   絵はすべて太いふちどりのステッカー調。大たんなのはテーブルクロスだけ、ほかはしずかに。単一テーマ。 */
:root{
  color-scheme: light;
  --wall:#BFE6DC;
  --wall-light:#DBF3EC;
  --cloth:#E4472F;
  --cloth-light:#FFF6EC;
  --ink:#2A2238;
  --sun:#FFC93C;
  --card:#FFFDF8;
  --muted:#6D6478;
  --line:#E9E2D6;
  --font-display:"Mochiy Pop One","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --font-body:"Klee One","UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --font-num:"Baloo 2","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--card);color:var(--ink);
  font-family:var(--font-body);font-weight:600;font-size:18px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #2F6BFF;outline-offset:3px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr)}

/* ---------- ステージ ---------- */
.stage{position:relative;overflow:hidden;background:var(--wall);border-right:4px solid var(--ink);min-height:0}
.stage svg.scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:14px;height:20px;border-radius:4px;border:2px solid var(--ink);
  animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.scene,.thumb{--fur:#F5B94E;--fur-light:#FFE6AE;--ear-in:#E8855A}
.ol{stroke:var(--ink);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.fur{fill:var(--fur)} .furl{fill:var(--fur-light)} .earin{fill:var(--ear-in)}
.thumb .ol{stroke-width:12}

#foodLift{transition:opacity .3s}
.scene[data-state="done"] #foodLift{opacity:0}
#chara,#foodLift,#rBack{will-change:transform}

.spark{fill:#FFC93C;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;opacity:0;animation:spark .95s ease-out forwards}
@keyframes spark{0%{opacity:0;scale:.2;rotate:-40deg}30%{opacity:1;scale:1.15}100%{opacity:0;scale:.7;rotate:50deg}}
.mogu{font-family:var(--font-display);font-size:30px;fill:var(--ink);animation:mogu 1.9s ease-out forwards}
@keyframes mogu{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}

/* ---------- パネル ---------- */
.panel{container-type:inline-size;display:flex;flex-direction:column;gap:18px;
  padding:clamp(14px,2.4vw,28px);overflow-y:auto;min-height:0}
.head{display:flex;flex-direction:column;align-items:stretch;gap:10px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(22px,5.6cqi,32px);margin:0;line-height:1.2;letter-spacing:.02em}
h1 span{color:var(--cloth)}
.tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.tool{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);font-size:15px}
.tool svg{width:20px;height:20px}
.tool[aria-pressed="false"] .on{display:none}
.tool[aria-pressed="true"] .off{display:none}

.view{display:none;flex-direction:column;gap:14px;flex:1;animation:viewIn .45s cubic-bezier(.2,.9,.3,1.15)}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}}
.v-run,.v-done{gap:22px}
body[data-phase="setup"] .v-setup,
body[data-phase="run"] .v-run,body[data-phase="pause"] .v-run,
body[data-phase="done"] .v-done{display:flex}

.group{display:flex;flex-direction:column;gap:10px}
.label{font-size:16px;color:var(--muted);display:flex;align-items:center;gap:10px}
.label::after{content:"";flex:1;border-top:2.5px dotted var(--line)}

.btn{border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:10px 18px;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;font-weight:600}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.main{background:var(--sun);font-family:var(--font-display);font-weight:400;font-size:clamp(22px,7cqi,32px);padding:12px 20px;letter-spacing:.06em}
.btn[aria-pressed="true"]{background:var(--sun)}
.v-setup .main{position:sticky;bottom:0;margin-top:auto;padding:7px 20px;font-size:clamp(22px,6cqi,28px)}

.time-row{display:flex;align-items:center;justify-content:center;gap:16px}
.step{width:56px;height:56px;padding:0;border-radius:50%;font-family:var(--font-num);font-size:38px;line-height:1;display:grid;place-items:center}
.mins{font-family:var(--font-num);font-weight:800;font-size:clamp(64px,24cqi,112px);line-height:.85;
  font-variant-numeric:tabular-nums;min-width:1.5em;text-align:center}
.unit{font-size:26px;align-self:flex-end;padding-bottom:6px;margin-left:-8px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips .btn{padding:6px 14px;border-radius:999px;box-shadow:0 4px 0 var(--ink);font-size:17px}
.chips .btn b{font-family:var(--font-num);font-size:21px;font-weight:800}

/* えらぶカード */
.picks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px}
.pick{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 8px 10px;line-height:1.3}
.pick .cap{font-size:14px;color:var(--muted)}
.pick .pic{width:min(124px,72%);display:block}
.pick .pic svg{width:100%;height:auto;display:block}
.pick .name{font-size:19px}
.pick .chg{font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--cloth-light);margin-top:2px}
.random{padding:6px 10px;box-shadow:0 5px 0 var(--ink);font-size:15px;line-height:1.25;border-style:dashed}

/* えらぶ一らん */
dialog{border:4px solid var(--ink);border-radius:24px;padding:0;background:var(--card);color:var(--ink);
  width:min(780px,94vw);max-height:90vh;font:inherit;overflow:auto}
dialog::backdrop{background:rgba(42,34,56,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg-head h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0}
.dlg-head .btn{padding:6px 16px;box-shadow:0 4px 0 var(--ink);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;padding-bottom:6px}
.grid .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;font-size:15px;line-height:1.3;box-shadow:0 4px 0 var(--ink)}
.grid svg{width:70px;height:auto;display:block}

/* タイマー中 */
.v-run,.v-done{justify-content:center;text-align:center}
.status{font-family:var(--font-display);font-size:clamp(20px,6cqi,30px);min-height:1.5em}
body[data-last="1"] .status{color:var(--cloth)}
.remain-label{font-size:20px;color:var(--muted)}
.clock{font-family:var(--font-num);font-weight:800;font-size:clamp(88px,34cqi,260px);line-height:.95;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bar{height:22px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--cloth-light)}
.bar i{display:block;height:100%;background:var(--cloth);transform-origin:left center;border-right:3px solid var(--ink)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.row .btn{flex:1 1 150px;font-size:22px;padding:14px 16px}
.done-msg{font-family:var(--font-display);font-size:clamp(30px,10cqi,64px);line-height:1.3;text-wrap:balance}
.done-msg b{display:inline-block;font-weight:400;animation:wave 1.5s ease-in-out infinite;animation-delay:calc(var(--i)*80ms)}
.done-msg .r{color:var(--cloth)}
@keyframes wave{0%,55%,100%{transform:translateY(0)}28%{transform:translateY(-14px)}}
.clock{transform-origin:center}

.btn:disabled{opacity:.45;cursor:not-allowed}
.tool{font-family:inherit;font-weight:600}

/* よく使う */
.favs{display:flex;flex-wrap:wrap;gap:8px}
.favs .btn{padding:3px 12px;border-radius:999px;box-shadow:0 4px 0 var(--ink);font-size:15px;display:flex;gap:6px;align-items:baseline}
.favs .btn b{font-family:var(--font-num);font-size:17px;font-weight:800}
.favs .edit{border-style:dashed}

/* 時間のきめ方 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg .btn{padding:5px 6px;font-size:16px;box-shadow:0 4px 0 var(--ink)}
.time-box{display:grid;grid-template-columns:clamp(88px,21cqi,112px) minmax(0,1fr);gap:14px;align-items:center}
.time-ctl{display:flex;flex-direction:column;gap:8px;min-width:0}
.time-ctl>div{display:flex;flex-direction:column;gap:8px}
.time-ctl>div[hidden]{display:none}
.v-setup .mins{font-size:clamp(50px,17cqi,82px)}
.v-setup .mins.endt{font-size:clamp(40px,14cqi,64px);min-width:0}
.v-setup .step{width:46px;height:46px;font-size:32px}
.v-setup .time-row{gap:10px}
.v-setup .chips{gap:7px}
.v-setup .chips .btn{padding:3px 8px;font-size:14px}
.v-setup .chips .btn b{font-size:18px}
.hint{text-align:center;font-size:16px;color:var(--muted);min-height:1.5em}
.now{text-align:center;font-size:15px;margin-top:2px}
.ck{width:100%;height:auto;display:block}
.ck-num{font-family:var(--font-num);font-weight:800;font-size:17px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.ck-plus{font-family:var(--font-body);font-weight:600;font-size:15px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}

/* 時計を出さない設定 */
.tool[aria-pressed="false"]{background:var(--line);color:var(--muted)}
body[data-noclock="1"] .time-box{grid-template-columns:1fr}
body[data-noclock="1"] #miniClock,body[data-noclock="1"] .big-clock,body[data-noclock="1"] #ckHud{display:none}
body[data-noclock="1"] .v-run .clock{font-size:clamp(64px,min(30cqi,24vh),210px)}
body[data-noclock="1"] .hud-clock{width:auto;min-width:210px;padding:10px 20px}

/* 時計を出さないときの、へっていくゲージ */
.gauge{display:none;position:relative;height:40px;border:4px solid var(--ink);border-radius:999px;background:var(--cloth-light);overflow:hidden;box-shadow:0 5px 0 var(--ink);margin:4px 0 8px}
body[data-noclock="1"] .gauge{display:block}
.gfill{position:absolute;inset:0;background:var(--cloth);transform-origin:left center;border-radius:999px;box-shadow:inset 0 -8px 0 rgba(42,34,56,.12),inset 0 6px 0 rgba(255,255,255,.28)}
.gticks{position:absolute;inset:0;pointer-events:none}
body[data-last="1"] .gfill{animation:gpulse 1s ease-in-out infinite}
@keyframes gpulse{50%{filter:brightness(1.18)}}
#gaugeHud{width:clamp(220px,26vw,360px);height:34px;margin:4px auto 6px}

/* えらぶカードは横ならび */
.pick{display:grid;grid-template-columns:clamp(48px,16cqi,68px) minmax(0,1fr);column-gap:10px;row-gap:0;align-items:center;justify-items:start;text-align:left;padding:8px 10px}
.pick .pic{grid-row:1 / span 3;width:100%}

/* タイマー中 */
.v-run{gap:10px}
.v-run .status{font-size:clamp(18px,5cqi,26px);min-height:1.4em}
.v-run .remain-label{font-size:16px}
.big-clock{width:min(60cqi,30vh);margin:0 auto}
.times{display:flex;justify-content:center;gap:18px;font-size:18px;flex-wrap:wrap}
.v-run .clock{font-size:clamp(46px,min(22cqi,13vh),118px)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row3 .btn{padding:10px 4px;font-size:19px}
.row3.small .btn{padding:7px 4px;font-size:15px;box-shadow:0 4px 0 var(--ink)}
body[data-hidenum="1"] #remainBox,body[data-hidenum="1"] #hudRemain{display:none}

/* 大きくうつす */
.hud{display:none}
body[data-present="1"] .app{grid-template-columns:1fr}
body[data-present="1"] .panel{display:none}
body[data-present="1"] .stage{border-right:0;border-bottom:0}
body[data-present="1"] .hud{display:block;position:absolute;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-clock{position:absolute;top:16px;right:16px;width:clamp(170px,25vw,340px);background:rgba(255,253,248,.93);border:3px solid var(--ink);border-radius:26px;padding:12px 12px 8px;text-align:center;box-shadow:0 6px 0 var(--ink)}
.hud-times{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:clamp(14px,1.5vw,19px);margin-top:4px}
.hud-remain{display:flex;align-items:baseline;justify-content:center;gap:8px;font-size:clamp(14px,1.5vw,18px);color:var(--muted)}
.hud-remain b{font-family:var(--font-num);font-weight:800;font-size:clamp(40px,6.4vw,92px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;display:inline-block}
.hud-status{font-family:var(--font-display);font-size:clamp(15px,1.8vw,24px);min-height:1.4em}
body[data-last="1"] .hud-status{color:var(--cloth)}
.hud-btns{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hud-btns .btn{padding:6px 14px;font-size:16px;box-shadow:0 4px 0 var(--ink)}
body[data-phase="done"] .hud .run-only,body:not([data-phase="done"]) .hud .done-only{display:none}

/* せっていの小さなまど */
.dlg p{margin:0}
.vol{display:flex;align-items:center;gap:12px}
.vol input{flex:1;accent-color:var(--cloth);height:28px}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding-bottom:6px}
.toggles .btn{display:flex;justify-content:space-between;gap:8px;font-size:17px;padding:8px 14px;box-shadow:0 4px 0 var(--ink)}
.fav-form{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fav-form input{flex:1;min-width:120px;font:inherit;padding:7px 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.fav-form .btn,.fav-row .btn{padding:6px 14px;font-size:16px;box-shadow:0 4px 0 var(--ink)}
.fav-list{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.fav-row{display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:2.5px dotted var(--line);padding-bottom:8px}
.note{color:var(--muted);font-size:16px}
.about{font-size:16px;line-height:1.7}
.about h3{font-family:var(--font-display);font-weight:400;font-size:18px;margin:12px 0 2px}
.about ul{margin:0;padding-left:1.3em}
.about small{color:var(--muted);font-size:14px}

/* 上のボタンは大きく（こどもの指でも押しやすく） */
.tool{flex-direction:column;justify-content:center;gap:1px;min-height:54px;padding:4px 2px;font-size:14px;border-radius:14px;line-height:1.2;box-shadow:0 3px 0 var(--ink)}
.tool svg{width:24px;height:24px}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.seg .btn{min-height:44px}
.chips .btn,.favs .btn{min-height:42px}
.row3.small .btn{min-height:46px}
.dlg-head .btn{min-height:44px}

/* せってい */
.set-sec{display:flex;flex-direction:column;gap:8px}
.set-sec h3{font-family:var(--font-display);font-weight:400;font-size:18px;margin:0}
.seg3{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.seg3 .btn{min-height:46px;padding:6px 10px;box-shadow:0 4px 0 var(--ink);font-size:17px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.themes .btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 6px 8px;box-shadow:0 4px 0 var(--ink);font-size:15px}
.sw{width:100%;height:46px;border-radius:9px;border:2.5px solid var(--ink)}

/* はんぶんの合図 */
.toast{position:absolute;left:50%;top:7%;transform:translateX(-50%);z-index:3;pointer-events:none;
  font-family:var(--font-display);font-size:clamp(22px,4vw,46px);background:#FFFDF8;border:4px solid var(--ink);border-radius:999px;
  padding:6px 28px;box-shadow:0 6px 0 var(--ink);white-space:nowrap;opacity:0}
.toast.show{animation:toast 3.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30px) scale(.6)}10%{opacity:1;transform:translate(-50%,0) scale(1.08)}16%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.ring-hint{font-size:16px;color:var(--muted);min-height:1.5em;text-align:center}

/* 終わる時こくの 手入力 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.endin{font-family:var(--font-num);font-weight:800;font-size:clamp(34px,11cqi,54px);line-height:1;color:var(--ink);
  width:min(100%,5.2em);min-width:0;padding:2px 8px;border:3px solid var(--ink);border-radius:14px;background:#fff;
  box-shadow:0 4px 0 var(--ink);font-variant-numeric:tabular-nums;cursor:text}
.endin:focus-visible{outline:4px solid #2F6BFF;outline-offset:3px}
.endin{text-align:center;width:min(100%,4.2em)}
.endin.bad{border-color:var(--cloth);box-shadow:0 4px 0 var(--cloth)}

/* せまい画面（スマートフォン・たてのタブレット） */
@container (max-width:460px){
  .picks{grid-template-columns:1fr 1fr}
  .random{grid-column:1 / -1;padding:8px}
  .random br{display:none}
  .pick{grid-template-columns:1fr;justify-items:center;text-align:center}
  .pick .pic{grid-row:auto;width:56px}
}

/* かべのかざり（さくら・ゆき） */
.dk{animation:dk linear infinite}
@keyframes dk{from{transform:translate(0,-80px) rotate(0deg)}to{transform:translate(var(--dx),620px) rotate(var(--r))}}

@media (max-width:860px){
  body[data-present="1"] .stage{height:100vh}
  .app{grid-template-columns:1fr;height:auto;min-height:100%}
  .stage{height:54vh;min-height:300px;border-right:0;border-bottom:4px solid var(--ink)}
  .panel{overflow:visible}
}
@media (prefers-reduced-motion:reduce){
  .scene *,.confetti i,.done-msg b,.view,.toast.show{animation:none !important}
  .toast.show{opacity:1}
}

        <mask id="mA" maskUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240"><rect x="-20" y="-20" width="240" height="240" fill="#fff"/><rect id="eat0" x="-20" y="-20" width="240" height="0" fill="#000"/><g id="bites0" fill="#000"></g></mask>
        <mask id="mB" maskUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240"><rect x="-20" y="-20" width="240" height="240" fill="#fff"/><rect id="eat1" x="-20" y="-20" width="240" height="0" fill="#000"/><g id="bites1" fill="#000"></g></mask>
        <mask id="mC" maskUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240"><rect x="-20" y="-20" width="240" height="240" fill="#fff"/><rect id="eat2" x="-20" y="-20" width="240" height="0" fill="#000"/><g id="bites2" fill="#000"></g></mask>

        <filter id="fFlesh" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feFlood id="fleshFlood" flood-color="#FFFFFF"/><feComposite operator="in" in2="SourceAlpha"/></filter>
        <radialGradient id="bodyShade" gradientUnits="userSpaceOnUse" cx="250" cy="235" r="350">
          <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".72" stop-color="#2A2238" stop-opacity="0"/><stop offset="1" stop-color="#2A2238" stop-opacity=".16"/>

  for(var i=0;i<KANA.length;i++)if(t.indexOf(KANA[i][0])>=0)t=t.split(KANA[i][0]).join(KANA[i][1]);

function skipNode(n){

function parseEnd(v){
  v=String(v||'').replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)})
    .replace(/[：時]/g,':').replace(/[分\s]/g,'');
  var m=/^(\d{1,2}):(\d{1,2})$/.exec(v)||/^(\d{1,2})(\d{2})$/.exec(v);
  if(!m)return null;
  var h=+m[1],mi=+m[2];
  return (h<24&&mi<60)?{h:h,m:mi}:null;
}
